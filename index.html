<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HRM</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Bengali",Segoe UI,Arial,sans-serif;background:#f3f4f6;color:#1c2330}
[hidden]{display:none!important}
button,input,select{font:inherit}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:#fff;border:1px solid #dfe3e8;border-radius:10px;padding:28px;width:100%;max-width:380px}
.box h1{margin:0 0 4px;font-size:20px}
.muted{color:#6b7280;font-size:14px}
label.f{display:block;margin-top:14px;font-size:14px}
input[type=email],input[type=password]{width:100%;padding:10px;border:1px solid #cbd2d9;border-radius:6px;margin-top:4px}
.btn{background:#1f4e79;color:#fff;border:0;border-radius:6px;padding:10px 16px;cursor:pointer}
.btn.full{width:100%;margin-top:18px}
.btn.ghost{background:none;color:#1f4e79;border:1px solid #1f4e79}
.err{color:#b42318;font-size:14px;margin-top:10px;min-height:18px}
header{background:#1f4e79;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header select{padding:6px;border-radius:6px;border:0}
nav{background:#fff;border-bottom:1px solid #dfe3e8;padding:0 12px;display:flex;gap:4px}
nav button{background:none;border:0;padding:12px;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{border-color:#1f4e79;font-weight:600}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #dfe3e8;border-radius:8px;padding:14px;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:8px}
.in{width:100%;padding:10px;border:1px solid #cbd2d9;border-radius:6px;margin-top:4px;background:#fff}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
</style>
</head>
<body>

<div id="login" class="center" hidden>
  <form id="lf" class="box">
    <h1>HRM সিস্টেম</h1>
    <div class="muted">চালিয়ে যেতে লগইন করুন</div>
    <label class="f">ইমেইল<input id="em" type="email" required autocomplete="username"></label>
    <label class="f">পাসওয়ার্ড<input id="pw" type="password" required autocomplete="current-password"></label>
    <div id="err" class="err"></div>
    <button class="btn full" type="submit">লগইন</button>
  </form>
</div>

<div id="pending" class="center" hidden>
  <div class="box">
    <h1>অনুমোদনের অপেক্ষায়</h1>
    <p class="muted">আপনার অ্যাকাউন্ট এখনও চালু করা হয়নি। অ্যাডমিনের সাথে যোগাযোগ করুন।</p>
    <button class="btn ghost" onclick="out()">বের হোন</button>
  </div>
</div>

<div id="app" hidden>
  <header>
    <select id="co"></select>
    <div><span id="who"></span> <button class="btn ghost" style="color:#fff;border-color:#fff;padding:4px 10px" onclick="out()">বের হোন</button></div>
  </header>
  <nav>
    <button id="tHome" class="on" onclick="home()">হোম</button>
    <button id="tEmp" onclick="emps()">কর্মী</button>
    <button id="tUsers" onclick="users()" hidden>ব্যবহারকারী</button>
  </nav>
  <main id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL = 'https://byhqnzxjdqbcgdvqezcl.supabase.co';
const SB_KEY = 'sb_publishable_0FncauhipNngq3W6H3Vftg_asXfIhfc';
const db = supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, companies = [], cur = null;

function show(v){ ['login','app','pending'].forEach(x => $(x).hidden = x !== v); }
function tab(id){ ['tHome','tEmp','tUsers'].forEach(x => $(x).classList.toggle('on', x === id)); }
async function out(){ await db.auth.signOut(); location.reload(); }

$('lf').onsubmit = async e => {
  e.preventDefault();
  $('err').textContent = '';
  const { error } = await db.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  if (error) { $('err').textContent = 'ইমেইল বা পাসওয়ার্ড ঠিক নয়'; return; }
  load();
};

async function load(){
  const { data: { user } } = await db.auth.getUser();
  const { data: p } = await db.from('profiles').select('*').eq('id', user.id).single();
  me = p;
  if (!p || !p.is_active) { show('pending'); return; }
  const { data: c } = await db.from('companies').select('*').order('name');
  companies = c || [];
  cur = companies[0] ? companies[0].id : null;
  $('who').textContent = (p.full_name || '') + ' · ' + p.role;
  $('co').innerHTML = companies.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('');
  $('co').onchange = () => { cur = $('co').value; home(); };
  $('tUsers').hidden = p.role !== 'admin';
  show('app');
  home();
}

async function home(){
  tab('tHome');
  const co = companies.find(x => x.id === cur);
  if (!co) { $('main').innerHTML = '<p class="muted">কোনো কোম্পানির অ্যাক্সেস দেওয়া হয়নি।</p>'; return; }
  const { data: s } = await db.from('sections').select('*').eq('company_id', cur).order('name');
  $('main').innerHTML = `<h2>${esc(co.name)}</h2><div class="muted">সেকশন</div>
    <div class="grid" style="margin-top:10px">${(s || []).map(x => `<div class="card">${esc(x.name)}</div>`).join('')}</div>`;
}

async function users(){
  tab('tUsers');
  const [{ data: ps }, { data: uc }] = await Promise.all([
    db.from('profiles').select('*').order('created_at'),
    db.from('user_companies').select('*')
  ]);
  $('main').innerHTML = '<h2>ব্যবহারকারী</h2>' + (ps || []).map(p => `
    <div class="card" data-u="${p.id}">
      <b>${esc(p.full_name)}</b>
      <div class="row">
        <select data-f="role" ${p.id === me.id ? 'disabled' : ''}>${['admin','gm','hr','viewer'].map(r => `<option ${r === p.role ? 'selected' : ''}>${r}</option>`).join('')}</select>
        <label><input type="checkbox" data-f="act" ${p.is_active ? 'checked' : ''} ${p.id === me.id ? 'disabled' : ''}> সক্রিয়</label>
      </div>
      <div class="row">${companies.map(c => `<label><input type="checkbox" data-f="co" value="${c.id}" ${(uc || []).some(u => u.user_id === p.id && u.company_id === c.id) ? 'checked' : ''}> ${esc(c.short_name || c.name)}</label>`).join('')}</div>
    </div>`).join('');
}


const ST = { active:'কর্মরত', resigned:'পদত্যাগ', terminated:'চাকরিচ্যুত', retired:'অবসর', other:'অন্যান্য' };
const canEdit = () => ['admin','gm','hr'].includes(me.role);
let EM = [];

async function emps(){
  tab('tEmp');
  const { data } = await db.from('employees').select('id,employee_no,name_bn,category,designation,status').eq('company_id', cur).order('employee_no');
  EM = data || [];
  $('main').innerHTML = `<div class="row" style="justify-content:space-between;margin:0"><h2 style="margin:0">কর্মী (${EM.length})</h2>${canEdit() ? '<button class="btn" onclick="empForm()">+ নতুন কর্মী</button>' : ''}</div>
    <input id="sq" class="in" style="margin:12px 0" placeholder="নাম বা ID দিয়ে খুঁজুন" oninput="elist()"><div id="el"></div>`;
  elist();
}

function elist(){
  const k = $('sq').value.trim().toLowerCase();
  $('el').innerHTML = EM.filter(e => !k || (e.name_bn + ' ' + e.employee_no).toLowerCase().includes(k)).map(e =>
    `<div class="card" style="cursor:pointer" onclick="empForm('${e.id}')"><b>${esc(e.name_bn)}</b> · ${esc(e.employee_no)}
     <div class="muted">${e.category === 'worker' ? 'শ্রমিক' : 'স্টাফ'} · ${esc(e.designation || '')} · ${ST[e.status]}</div></div>`).join('') || '<p class="muted">কোনো কর্মী নেই</p>';
}

async function empForm(id){
  let e = { category:'worker', status:'active', gender:'male' };
  const sec = (await db.from('sections').select('*').eq('company_id', cur).order('name')).data || [];
  let sal = [];
  if (id) {
    e = (await db.from('employees').select('*').eq('id', id).single()).data;
    sal = (await db.from('salary_history').select('*').eq('employee_id', id).order('effective_from', { ascending:false })).data || [];
  } else {
    const { data } = await db.from('employees').select('employee_no').eq('company_id', cur);
    const n = (data || []).map(x => parseInt(x.employee_no)).filter(x => !isNaN(x));
    e.employee_no = String((n.length ? Math.max(...n) : 0) + 1);
  }
  const ro = canEdit() ? '' : 'disabled';
  const inp = (k, l, t) => `<label class="f">${l}<input class="in" data-k="${k}" type="${t || 'text'}" value="${esc(e[k] || '')}" ${ro}></label>`;
  const sel = (k, l, o) => `<label class="f">${l}<select class="in" data-k="${k}" ${ro}>${o.map(([v, t]) => `<option value="${v}" ${(e[k] || '') == v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>`;
  $('main').innerHTML = `<button class="btn ghost" onclick="emps()">← ফিরে যান</button>
  <h2>${id ? esc(e.name_bn) : 'নতুন কর্মী'}</h2>
  <div class="card"><div id="ef" class="two">
    ${inp('employee_no', 'কর্মী ID')}
    ${sel('category', 'ধরন', [['worker', 'শ্রমিক'], ['staff', 'স্টাফ']])}
    ${sel('section_id', 'সেকশন', [['', '—']].concat(sec.map(s => [s.id, s.name])))}
    ${inp('name_bn', 'নাম (বাংলা)')}${inp('name_en', 'নাম (English)')}
    ${inp('father_name', 'পিতার নাম')}${inp('mother_name', 'মাতার নাম')}${inp('spouse_name', 'স্বামী/স্ত্রীর নাম')}
    ${sel('gender', 'লিঙ্গ', [['male', 'পুরুষ'], ['female', 'নারী'], ['other', 'অন্যান্য']])}
    ${inp('dob', 'জন্ম তারিখ', 'date')}${inp('nid_no', 'NID / জন্মনিবন্ধন নম্বর')}
    ${inp('phone', 'মোবাইল')}${inp('emergency_name', 'জরুরি যোগাযোগের নাম')}${inp('emergency_phone', 'জরুরি যোগাযোগের মোবাইল')}
    ${inp('present_address', 'বর্তমান ঠিকানা')}${inp('permanent_address', 'স্থায়ী ঠিকানা')}
    ${inp('designation', 'পদবি')}${inp('grade', 'গ্রেড')}${inp('join_date', 'যোগদানের তারিখ', 'date')}
    ${sel('status', 'অবস্থা', Object.entries(ST))}
    ${inp('exit_date', 'চাকরি ছাড়ার তারিখ', 'date')}${inp('exit_reason', 'কারণ')}
    ${sel('payment_method', 'বেতন পরিশোধ', [['', '—'], ['cash', 'নগদ'], ['bank', 'ব্যাংক'], ['mobile', 'মোবাইল']])}${inp('payment_account', 'অ্যাকাউন্ট/নম্বর')}
  </div>${canEdit() ? `<button class="btn" style="margin-top:16px" onclick="saveEmp('${id || ''}')">সংরক্ষণ করুন</button>` : ''}</div>
  ${id ? `<h3>বেতনের ইতিহাস</h3>
  ${sal.map(x => `<div class="card"><b>${x.effective_from}</b> থেকে · মূল ${x.basic} · বাড়িভাড়া ${x.house_rent} · চিকিৎসা ${x.medical} · যাতায়াত ${x.conveyance} · অন্যান্য ${x.other_allowance} · <b>মোট ${(+x.basic + +x.house_rent + +x.medical + +x.conveyance + +x.other_allowance).toFixed(2)}</b>${x.note ? '<div class="muted">' + esc(x.note) + '</div>' : ''}</div>`).join('') || '<p class="muted">এখনও কিছু নেই</p>'}
  ${canEdit() ? `<div class="card"><b>নতুন বেতন / ইনক্রিমেন্ট</b><div class="two">
    <label class="f">কার্যকর তারিখ<input id="s_effective_from" class="in" type="date"></label>
    <label class="f">মূল বেতন<input id="s_basic" class="in" type="number" min="0"></label>
    <label class="f">বাড়িভাড়া<input id="s_house_rent" class="in" type="number" min="0"></label>
    <label class="f">চিকিৎসা<input id="s_medical" class="in" type="number" min="0"></label>
    <label class="f">যাতায়াত<input id="s_conveyance" class="in" type="number" min="0"></label>
    <label class="f">অন্যান্য ভাতা<input id="s_other_allowance" class="in" type="number" min="0"></label>
    <label class="f">মন্তব্য<input id="s_note" class="in"></label></div>
    <button class="btn" style="margin-top:14px" onclick="addSal('${id}')">যোগ করুন</button></div>` : ''}` : '<p class="muted">সংরক্ষণের পর বেতন যোগ করা যাবে।</p>'}`;
}

async function saveEmp(id){
  const o = { company_id: cur };
  document.querySelectorAll('#ef .in').forEach(i => o[i.dataset.k] = i.value.trim() || null);
  if (!o.employee_no || !o.name_bn || !o.join_date) { alert('ID, নাম ও যোগদানের তারিখ আবশ্যক'); return; }
  const r = id ? await db.from('employees').update(o).eq('id', id).select().single()
               : await db.from('employees').insert(o).select().single();
  if (r.error) { alert('সংরক্ষণ হয়নি: ' + r.error.message); return; }
  empForm(r.data.id);
}

async function addSal(id){
  const g = k => $('s_' + k).value;
  if (!g('effective_from') || !g('basic')) { alert('কার্যকর তারিখ ও মূল বেতন দিন'); return; }
  const r = await db.from('salary_history').insert({
    employee_id: id, company_id: cur, effective_from: g('effective_from'),
    basic: +g('basic') || 0, house_rent: +g('house_rent') || 0, medical: +g('medical') || 0,
    conveyance: +g('conveyance') || 0, other_allowance: +g('other_allowance') || 0, note: g('note') || null
  });
  if (r.error) { alert('সংরক্ষণ হয়নি: ' + r.error.message); return; }
  empForm(id);
}

$('main').onchange = async e => {
  const t = e.target, card = t.closest('[data-u]');
  if (!card) return;
  const id = card.dataset.u, f = t.dataset.f;
  let r;
  if (f === 'role') r = await db.from('profiles').update({ role: t.value }).eq('id', id);
  if (f === 'act') r = await db.from('profiles').update({ is_active: t.checked }).eq('id', id);
  if (f === 'co') r = t.checked
    ? await db.from('user_companies').insert({ user_id: id, company_id: t.value })
    : await db.from('user_companies').delete().eq('user_id', id).eq('company_id', t.value);
  if (r && r.error) alert('সংরক্ষণ হয়নি: ' + r.error.message);
};

(async () => {
  const { data: { session } } = await db.auth.getSession();
  session ? load() : show('login');
})();
</script>
</body>
</html>
